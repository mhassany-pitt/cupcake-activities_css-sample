id: free_coding_bank_account
title: Bank Account Card Styling in CSS3
description: Write CSS rules for transactions, balance displays, and action button hover states in a BankAccount card component.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: free-coding
  difficulty: novice
  prereq_topics:
    - css3-basics
    - box-model
  topics:
    - css3
    - flexbox
    - typography
    - pseudo-classes
    - transitions
    - ui-components
runtime:
  language: css
statement: |
  Write the CSS rules to complete the `BankAccount` card component:
  1. Add `.account-transactions` (Flexbox column with `gap: 8px`), `.transaction-deposit` (`color: #16a34a`), and `.transaction-withdraw` (`color: #dc2626`).
  2. Add `.account-balance` (Flexbox column with `gap: 4px`) and `.balance-output` (`font-size: 1.5rem`, `font-weight: 800`, `color: #1e293b`).
  3. Add `.account-actions` (Flexbox row with `gap: 8px`), `.btn` base styles with transitions, and custom styles for `.btn-deposit` / `.btn-deposit:hover` and `.btn-withdraw` / `.btn-withdraw:hover`.
executions:
  - title: Standard Transaction Styling
    stdin: []
    stdout: 'CSS Evaluated: 1309 bytes'
    console: 'CSS Evaluated: 1309 bytes'
    status: pass
elements:
  - type: locked
    location:
      snippet: |-
        .bank-account {
          max-width: 360px;
          background: #ffffff;
          border: 1px solid #e2e8f0;
          border-radius: 12px;
          padding: 20px;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
          display: flex;
          flex-direction: column;
          gap: 16px;
        }

        .account-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .account-owner {
          margin: 0;
          font-size: 1.25rem;
          font-weight: 700;
          color: #0f172a;
        }
  - type: editable
    location:
      snippet: |-
        .account-transactions {
          display: flex;
          flex-direction: column;
          gap: 8px;
        }

        .transaction-deposit {
          margin: 0;
          color: #16a34a;
          font-weight: 600;
          font-size: 0.9rem;
        }

        .transaction-withdraw {
          margin: 0;
          color: #dc2626;
          font-weight: 600;
          font-size: 0.9rem;
        }

        .account-balance {
          display: flex;
          flex-direction: column;
          gap: 4px;
        }

        .balance-output {
          margin: 0;
          font-size: 1.5rem;
          font-weight: 800;
          color: #1e293b;
        }

        .account-actions {
          display: flex;
          gap: 8px;
        }

        .btn {
          flex: 1;
          padding: 8px 16px;
          border-radius: 6px;
          font-weight: 600;
          cursor: pointer;
          border: none;
          transition: all 0.2s ease;
        }

        .btn-deposit {
          background-color: #2563eb;
          color: #ffffff;
        }

        .btn-deposit:hover {
          background-color: #1d4ed8;
        }

        .btn-withdraw {
          background-color: #f1f5f9;
          color: #334155;
        }

        .btn-withdraw:hover {
          background-color: #e2e8f0;
        }
    placeholder: |-
