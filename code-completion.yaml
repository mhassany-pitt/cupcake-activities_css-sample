id: cc_bank_account
title: Complete the BankAccount CSS Rules
description: Fill in essential CSS layout values, axis directions, cursor cues, and pseudo-class selectors to style a bank account card.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: code-completion
  difficulty: novice
  prereq_topics:
    - css3-basics
    - box-model
  topics:
    - css3
    - flexbox
    - layout
    - pseudo-classes
    - interactivity
runtime:
  language: css
statement: |
  Complete the `BankAccount` card styles by selecting the correct CSS layout properties, axis directions, interactive cursor cues, and pseudo-class selectors.
  Make sure to:
  1. Configure the card container as a Flexbox layout context.
  2. Set the main layout axis to stack child sections vertically.
  3. Set the button cursor style to indicate interactivity.
  4. Specify the interactive hover pseudo-class on the deposit button.
executions:
  - title: Bob's Account
    stdin: []
    stdout: |-
      CSS Evaluated: 1309 bytes
    console: |-
      CSS Evaluated: 1309 bytes
    stderr: ""
    status: pass
elements:
  - type: blank
    location:
      context: "display: flex;"
      snippet: "flex"
      nth: 1
    choices:
      - snippet: "flex"
        role: solution
        explanations:
          - body: |
              Correct! `display: flex` establishes a Flexible Box layout context, enabling flex direction and uniform gap spacing.
      - snippet: "grid"
        role: distractor
        explanations:
          - body: |
              Incorrect. While `display: grid` creates a grid layout, the component uses Flexbox column properties.
      - snippet: "block"
        role: distractor
        explanations:
          - body: |
              Incorrect. Standard block formatting does not support `gap: 16px` between direct child elements in the same way.
      - snippet: "inline"
        role: distractor
        explanations:
          - body: |
              Incorrect. `display: inline` prevents the element from accepting width/height and vertical padding properly.
  - type: blank
    location:
      context: "flex-direction: column;"
      snippet: "column"
      nth: 1
    choices:
      - snippet: "column"
        role: solution
        explanations:
          - body: |
              Correct! `flex-direction: column` stacks the header, transaction feed, balance callout, and action buttons vertically.
      - snippet: "row"
        role: distractor
        explanations:
          - body: |
              Incorrect. `flex-direction: row` aligns items horizontally side-by-side, which would break the vertical card layout.
      - snippet: "column-reverse"
        role: distractor
        explanations:
          - body: |
              Incorrect. `column-reverse` would invert the layout, placing the buttons at the top and the header at the bottom.
      - snippet: "initial"
        role: distractor
        explanations:
          - body: |
              Incorrect. The initial value of `flex-direction` is `row`, which defaults to horizontal placement.
  - type: blank
    location:
      context: "cursor: pointer;"
      snippet: "pointer"
      nth: 1
    choices:
      - snippet: "pointer"
        role: solution
        explanations:
          - body: |
              Correct! `cursor: pointer` changes the mouse cursor to a pointing hand, signaling that the button is clickable.
      - snippet: "default"
        role: distractor
        explanations:
          - body: |
              Incorrect. `cursor: default` displays the standard arrow cursor, providing no visual affordance that the element is clickable.
      - snippet: "text"
        role: distractor
        explanations:
          - body: |
              Incorrect. `cursor: text` displays an I-beam text selection cursor, typically reserved for editable text inputs.
      - snippet: "not-allowed"
        role: distractor
        explanations:
          - body: |
              Incorrect. `cursor: not-allowed` indicates a disabled state, which is misleading for active transaction buttons.
  - type: blank
    location:
      context: ".btn-deposit:hover"
      snippet: ":hover"
      nth: 1
    choices:
      - snippet: ":hover"
        role: solution
        explanations:
          - body: |
              Correct! The `:hover` pseudo-class applies the darkened blue background when the user hovers their cursor over the button.
      - snippet: ":active"
        role: distractor
        explanations:
          - body: |
              Incorrect. `:active` only applies while the user is actively pressing the mouse button down.
      - snippet: ":focus"
        role: distractor
        explanations:
          - body: |
              Incorrect. `:focus` is triggered when an element receives keyboard focus, not purely cursor hover.
      - snippet: ":visited"
        role: distractor
        explanations:
          - body: |
              Incorrect. `:visited` applies to anchor links that the user has previously navigated to in their browser history.
