  activity: parsons-puzzles
  difficulty: novice
  prereq_topics:
    - css3-basics
    - box-model
  topics:
    - css3
    - flexbox
    - typography
    - pseudo-classes
    - transitions
    - ui-components
runtime:
  language: css
statement: |
  Rearrange the CSS rule blocks to correctly style the `BankAccount` card component.
  Make sure to:
  1. Define the card container layout (`.bank-account`).
  2. Style the deposit and withdrawal transaction records (`.transaction-deposit`, `.transaction-withdraw`).
  3. Style the balance callout (`.balance-output`).
  4. Style the action buttons and hover pseudo-classes (`.btn-deposit`, `.btn-withdraw`).
