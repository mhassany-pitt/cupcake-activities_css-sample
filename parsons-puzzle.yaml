  - title: Standard Transaction
    stdout: |-
      CSS Evaluated: 1309 bytes
    console: |-
      CSS Evaluated: 1309 bytes
    status: pass
elements:
  - type: block
    group: css-rules
    location:
      snippet: |-
        .bank-account {
          max-width: 360px;
          background: #ffffff;
          border: 1px solid #e2e8f0;
          border-radius: 12px;
          padding: 20px;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
          display: flex;
          flex-direction: column;
          gap: 16px;
        }
    choices:
      - snippet: |-
          .bank-account {
            max-width: 360px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 16px;
          }
        role: solution
        explanations:
          - body: |
              Correct! Sets up the card container with 360px max width, border radius, subtle shadow, and vertical Flexbox layout.
      - snippet: |-
          .bank-account {
            max-width: 360px;
            background: #ffffff;
            display: inline;
          }
        role: distractor
        explanations:
          - body: |
              Incorrect. Setting `display: inline` disables block container behavior and breaks internal Flexbox item layout.
  - type: block
    group: css-rules
    location:
      snippet: |-
        .transaction-deposit {
          margin: 0;
          color: #16a34a;
          font-weight: 600;
          font-size: 0.9rem;
        }

        .transaction-withdraw {
          margin: 0;
          color: #dc2626;
          font-weight: 600;
          font-size: 0.9rem;
        }
    choices:
      - snippet: |-
          .transaction-deposit {
            margin: 0;
            color: #16a34a;
            font-weight: 600;
            font-size: 0.9rem;
          }

          .transaction-withdraw {
            margin: 0;
            color: #dc2626;
            font-weight: 600;
            font-size: 0.9rem;
          }
        role: solution
        explanations:
          - body: |
              Correct! Renders deposits in green (`#16a34a`) and withdrawals in red (`#dc2626`).
      - snippet: |-
          .transaction-deposit {
            margin: 0;
            color: #dc2626;
            font-weight: 600;
            font-size: 0.9rem;
          }

          .transaction-withdraw {
            margin: 0;
            color: #16a34a;
            font-weight: 600;
            font-size: 0.9rem;
          }
        role: distractor
        explanations:
          - body: |
              Incorrect. The color assignments are inverted: deposits are styled red and withdrawals green!
  - type: block
    group: css-rules
    location:
      snippet: |-
        .balance-output {
          margin: 0;
          font-size: 1.5rem;
          font-weight: 800;
