id: pp_bank_account
source: style.css
title: Bank Account Card CSS Rules
description: Rearrange the CSS rule blocks to construct a clean, modern bank account card design with Flexbox, typography scales, color coding, and button hover states.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
