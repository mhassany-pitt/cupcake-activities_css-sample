    - typography
    - pseudo-classes
    - transitions
    - ui-components
runtime:
  language: css
statement: |
  This worked example demonstrates how `BankAccount` card visual design and layout are constructed using modern CSS3. We'll examine:
  1. The card container layout with Flexbox (`display: flex`, `gap: 16px`), border radii, and soft shadows.
  2. Account owner typography and heading styling.
  3. Transaction feed styling using semantic green (`#16a34a`) for deposits and red (`#dc2626`) for withdrawals.
  4. Balance text prominence using heavy `font-weight: 800`.
  5. Action button color schemes, interactive `:hover` pseudo-classes, and smooth `transition` timing.
executions:
  - title: Bob's Account
    stdin: []
    stdout: 'CSS Evaluated: 1309 bytes'
    console: 'CSS Evaluated: 1309 bytes'
    status: pass
elements:
  - type: explanation
    location:
      snippet: |-
        .bank-account {
          max-width: 360px;
          background: #ffffff;
          border: 1px solid #e2e8f0;
          border-radius: 12px;
          padding: 20px;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
          display: flex;
          flex-direction: column;
          gap: 16px;
        }
    explanations:
      - body: |
          ### 1. Card Container Layout
          * `display: flex` and `flex-direction: column`: Organizes child sections vertically.
          * `gap: 16px`: Provides uniform vertical spacing between child sections without cumbersome margin collapsing.
          * `border-radius: 12px` and `box-shadow`: Creates a modern elevated card container with rounded corners.
  - type: explanation
    location:
      snippet: |-
        .account-owner {
          margin: 0;
          font-size: 1.25rem;
          font-weight: 700;
          color: #0f172a;
        }
    explanations:
      - body: |
          ### 2. Heading Typography
          * `font-size: 1.25rem` and `font-weight: 700`: Renders the account owner name with strong visual hierarchy.
          * `color: #0f172a`: Uses a dark slate color for high-contrast, accessible readability.
  - type: explanation
    location:
      snippet: |-
        .transaction-deposit {
          margin: 0;
          color: #16a34a;
          font-weight: 600;
          font-size: 0.9rem;
        }

        .transaction-withdraw {
          margin: 0;
          color: #dc2626;
          font-weight: 600;
          font-size: 0.9rem;
        }
    explanations:
      - body: |
          ### 3. Transaction Color Coding
          * `.transaction-deposit`: Uses green (`#16a34a`) to visually communicate positive incoming credits.
          * `.transaction-withdraw`: Uses red (`#dc2626`) to clearly indicate outgoing debits.
  - type: explanation
    location:
      snippet: |-
        .balance-output {
          margin: 0;
          font-size: 1.5rem;
          font-weight: 800;
          color: #1e293b;
        }
    explanations:
      - body: |
          ### 4. Balance Callout
          * `font-size: 1.5rem` and `font-weight: 800`: Makes the final account balance the primary visual anchor on the card.
  - type: explanation
    location:
      snippet: |-
        .btn-deposit {
          background-color: #2563eb;
          color: #ffffff;
        }

        .btn-deposit:hover {
          background-color: #1d4ed8;
        }
    explanations:
      - body: |
          ### 5. Button Styling and Hover States
          * `background-color: #2563eb`: Uses primary blue for the call-to-action button with white text.
          * `.btn-deposit:hover`: Darkens the background to `#1d4ed8` on user cursor hover, paired with `transition: all 0.2s ease` on `.btn` for smooth interactive feedback.
