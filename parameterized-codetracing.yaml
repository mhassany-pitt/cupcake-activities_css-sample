$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/parameterized-code-tracing/0.1.0
license: MIT
locale: en-US
id: parameterized_code_tracing_bank_account
source: style.css
title: Trace CSS Bank Account Card Properties
description: Trace and inspect the evaluated CSS property values as container width, transaction colors, and button themes vary.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: parameterized-code-tracing
  difficulty: novice
  prereq_topics:
    - css3-basics
    - box-model
  topics:
    - css3
    - flexbox
    - typography
    - pseudo-classes
    - transitions
    - ui-components
    - state-tracing
runtime:
  language: css
  version: 3
statement: |
  Inspect the CSS properties for the Bank Account card stylesheet.
  Pay close attention to:
  * The maximum width of the card container (`.bank-account`).
  * The text color of the deposit transaction (`.transaction-deposit`).
  * The background color of the deposit action button (`.btn-deposit`).
hints:
  - "Trace the parameter values step-by-step through each statement."
  - "Check if the withdrawal amount exceeds the balance to determine which branch executes."
testcases:
  - title: Standard Trace Execution
    visible: true
    stdin: []
    stdout: "CSS Evaluated: 1309 bytes"
    console: "CSS Evaluated: 1309 bytes"
    status: pass
    feedback:
      on_pass:
        - "Correct trace! You tracked the state transitions and outputs accurately."
      on_fail:
        - "Your trace output did not match. Trace each parameter update carefully."
elements:
  - type: parameter
    location:
      context: 'max-width: 360px;'
      snippet: 360px
    values:
      - 360px
      - 400px
      - 480px
  - type: parameter
    location:
      context: 'color: #16a34a;'
      snippet: '#16a34a'
    values:
      - '#16a34a'
      - '#22c55e'
      - '#15803d'
  - type: parameter
    location:
      context: 'background-color: #2563eb;'
      snippet: '#2563eb'
    values:
      - '#2563eb'
      - '#1d4ed8'
      - '#3b82f6'
