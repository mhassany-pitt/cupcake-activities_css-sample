id: mcq_bank_account_button_hover
title: CSS Interactive Button Hover State Implementation
description: Choose the correct CSS rule to style the interactive hover state of the deposit button.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: multiple-choice-question
  difficulty: intermediate
  prereq_topics:
    - css3-basics
    - selectors
  topics:
    - css3
    - pseudo-classes
    - selectors
    - interactivity
    - transitions
include_choices: 4
question: |
  Given the `BankAccount` card component with a primary deposit button (`<button class="btn btn-deposit">`):
  
  Which of the following represents the correct CSS selector and rule to apply a darkened background color when the user hovers their mouse cursor over the deposit button?
choices:
  - body: |
      ```css
      .btn-deposit:hover {
        background-color: #1d4ed8;
      }
      ```
    role: solution
    include: always
    order: 1
    explanations:
      - body: |
          Correct! The `:hover` pseudo-class selector dynamically matches an element when the user points to it with a cursor, successfully applying the darkened background color.
  - body: |
      ```css
      .btn-deposit.hover {
        background-color: #1d4ed8;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. `.btn-deposit.hover` attempts to match an element that has a literal class name `class="... hover"`, rather than the dynamic browser `:hover` pseudo-class.
  - body: |
      ```css
      .btn-deposit::hover {
        background-color: #1d4ed8;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. Double-colon syntax `::` is reserved for CSS pseudo-elements (e.g. `::before`, `::after`), whereas `:hover` is a state pseudo-class requiring a single colon `:`.
  - body: |
      ```css
      .btn-deposit:active {
        background-color: #1d4ed8;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. The `:active` pseudo-class only applies while the user is actively pressing and holding down the mouse button, not while simply hovering over the element.
