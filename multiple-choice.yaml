license: MIT
locale: en-US
id: mcq_bank_account_deposit
title: CSS Action Button Styling Rules
description: Choose the correct CSS rule for styling the deposit button on the Bank Account card.
authors:
  - first: Jone
    last: Doe
    email: jone.doe@example.com
    affiliation: University of John Doe
pedagogy:
  activity: multiple-choice-question
  difficulty: intermediate
  prereq_topics:
    - css3-basics
    - box-model
  topics:
    - css3
    - styling
    - color-contrast
    - selectors
include_choices: 4
question: |
  Given the `BankAccount` card component, which of the following represents the correct standard CSS rule to style the primary deposit button (`.btn-deposit`) with a blue background and white text?
choices:
  - body: |
      ```css
      .btn-deposit {
        background-color: #2563eb;
        color: #ffffff;
      }
      ```
    role: solution
    include: always
    order: 1
    explanations:
      - body: |
          Correct! This rule sets `background-color` to `#2563eb` (primary blue) and `color` to `#ffffff` (white), providing high contrast and clear visual hierarchy.
  - body: |
      ```css
      .btn-deposit {
        background-color: #ffffff;
        color: #ffffff;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. Setting both background and foreground text colors to `#ffffff` renders the button label invisible.
  - body: |
      ```css
      .btn-deposit {
        text-color: #ffffff;
        bg-color: #2563eb;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. `text-color` and `bg-color` are not valid standard CSS properties; the standard properties are `color` and `background-color`.
  - body: |
      ```css
      .btn-deposit {
        background: #2563eb;
        font-color: #ffffff;
      }
      ```
    role: distractor
    explanations:
      - body: |
          Incorrect. `font-color` is not a valid CSS property (the standard property for text color is simply `color`).
